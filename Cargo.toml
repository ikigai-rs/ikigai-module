[package]
name = "ikigai-module"
# 0.3.0: the module PROTOCOL grows, and `ModuleCall` / `ModuleReply` are public exhaustive
# enums, so a new variant is source-breaking for any exhaustive match outside this crate.
# The wire itself does not break — every 0.2 message keeps its bytes (postcard keys an enum
# on its variant index; the new variants are appended) — but a mixed pairing degrades on
# the paths the new messages cover: an old host cannot decode a typed failure or a threaded
# result from a new module, an old module cannot decode a typed failure from a new host.
# Every success and every `Error::Endpoint` still crosses in the 0.2 shape. Also breaking:
# `serve_host_call`'s resolver returns the kernel's typed `Error`, not a `String`.
#
# (0.2.0, not 0.1.11: cargo treats 0.1.x as one compatible range, and that was a BREAKING
# change in both directions. Source-breaking — `ModuleSpace::new`, `ModuleSpace::connect` and
# `WasmModuleSpace::new` each take a `ModuleFloor` by value, so every mount site must state
# what the module may do (the compile error IS the review trigger; a floor that could be
# omitted would be the hole this closes). Behavior-breaking — a module endpoint's declared
# `requires` is now ENFORCED across the boundary, so a caller that used to reach an
# under-capability'd module endpoint is now correctly denied.)
#
# 0.3.1: no API change. Both `Space::resolve` impls build `Resolved` through its
# constructor instead of a struct literal, so the crate compiles against core 0.1.78
# (which adds `Resolved.answered_by`) as well as every earlier core the pin admits.
# Published BEFORE core 0.1.78 on purpose: this crate commits no lockfile, and 0.3.0 on
# crates.io stops compiling for every lockless consumer the moment 0.1.78 is published.
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "The ikigai dynamically-loadable module format (Phase 1: in-process proof). A host-side ModuleSpace routes IRIs to a module over a ModuleTransport; the module's endpoints resolve their sub-resources back against the host kernel."
repository = "https://github.com/ikigai-rs/ikigai-module"
homepage = "https://github.com/ikigai-rs/ikigai-module"
keywords = ["ikigai", "roc", "module", "wasm", "plugin"]

[dependencies]
# 0.1.64 = `Resolved.canonical` (the alias/rewrite-reporting field) with `Resolved::new`
# and `Resolved::with_canonical`, which both `Space::resolve` impls below use to report the
# module's declared rewrite. The pin states the true minimum API this crate CALLS — not the
# newest field `Resolved` has. ⚠ Read the caret as a range: it admits every later 0.1.x,
# and this crate commits no lockfile, so CI and every consumer's fresh resolve take the
# newest core on crates.io. Both impls used to build a `Resolved` struct literal on
# purpose, so the next field would break the site and force a re-read of the
# `canonical: None` claim; the earlier floor, 0.1.46 = `SpaceEntry::new`, came from the
# same choice when the federated-catalog `origin` field broke THAT literal. The third
# time (core 0.1.78, `Resolved.answered_by`) the break landed where a lockless published
# crate breaks: in CI and on crates.io for every consumer, fixable only by a release. The
# constructor compiles against every core the caret admits, and the pin does NOT move for
# 0.1.78 because nothing here needs it.
# 0.1.64 is also the floor for the rest of the rewrite story a module now declares:
# `AliasTable::{parse, to_text}` (the declaration's text form on the wire), `AliasRule`'s
# accessors (mount-time validation) and `Canonical` — plus, decisively, the kernel ADOPTING
# a reported canonical, without which a declared rewrite would resolve and still split.
ikigai-core = "0.1.64"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# A module's card crosses the wire as JSON text inside the postcard frame: core's
# `Description` derives serde for JSON (`skip_serializing_if`), and postcard is not
# self-describing, so it cannot ride the frame directly. See `ModuleCard`.
serde_json = "1"
# The loopback transport runs the ModuleCall/ModuleReply session over in-memory byte
# channels: futures for the channels + lock + join!, postcard for the codec (the same
# postcard framing ikigai-wire uses; `alloc` keeps it wasm-clean).
futures = "0.3"
postcard = { version = "1", features = ["alloc"] }

# The UDS module server's peercred check (refuse connections from other users) needs the
# kernel-verified peer UID — SO_PEERCRED / getpeereid — which is FFI. Unix only, so wasm
# and Windows never pull it; the crate stays wasm-clean.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The module recipe as one test, across the boundary (`tests/conformance.rs`): one fixture
# module walked bare and through every mount, every report held to the bare one —
# identical catalog and descriptions, cacheability by thread name, every error type
# preserved in both directions. 0.2.0 pulls ikigai-core 0.1.69, which the caret above
# admits; the library itself needs nothing past its own pin.
#
# 0.2.0 = `Check::Declarations`, which is why the floor moved: it reports a declaration no
# check consulted, and this crate's walk is the case it was written for. One suite was being
# run over two different manifolds — the mounts that ask the module for its cards, and
# `ModuleSpace::new`, which never asks — so through the latter every statement about a module
# endpoint named an id the walk could not reach, and the report printed them anyway. The fix
# is one suite per manifold, not a version floor; the pin is what surfaced it.
ikigai-conformance = "0.2.0"
